<!doctype html>
<html>
  <head>
    <title>Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="html.style.css" />

    <script src="../importmap/inject.js"></script>
    <script src="../importmap/importmap.build.js"></script>
  </head>

  <body>
    <script src="index.js" type="module"></script>

    <section class="stage">
      <window-panel>
        <span slot="title">Window title</span>
        <p class="content">
          The content of the window. Drag the bar to move the window, and the
          grip at its lower right to resize it.
        </p>
      </window-panel>
    </section>

    <main class="controls">
      <section class="group">
        <h2>States</h2>
        <dl id="states"></dl>
      </section>

      <section class="group">
        <h2>Data</h2>
        <div id="samples" class="buttons"></div>
        <pre id="data"></pre>
      </section>

      <section class="group">
        <h2>Operations</h2>
        <div id="operations" class="buttons"></div>
        <div class="buttons page">
          <button id="place" type="button">Place the panel again</button>
        </div>
      </section>

      <section class="group">
        <h2>Events</h2>
        <div class="buttons">
          <button id="clear" type="button">Clear</button>
        </div>
        <ol id="events"></ol>
      </section>
    </main>
  </body>
</html>
